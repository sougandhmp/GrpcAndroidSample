syntax = "proto3";

package greeter;

option java_multiple_files = true;
option java_package = "com.example.grpc.greeter";
option java_outer_classname = "GreeterProto";

// A tiny service that shows the two most common call types.
service Greeter {
  // Unary: one request -> one response.
  rpc SayHello (HelloRequest) returns (HelloReply);

  // Server streaming: one request -> a stream of responses.
  rpc StreamGreetings (StreamRequest) returns (stream HelloReply);
}

message HelloRequest {
  string name = 1;
}

message StreamRequest {
  string name = 1;
  int32 count = 2;   // how many greetings to stream back
}

message HelloReply {
  string message = 1;
  int64 timestamp_millis = 2;
}
